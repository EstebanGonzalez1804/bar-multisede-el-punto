server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router (SPA): cualquier ruta que no sea un archivo real cae a
    # index.html para que el enrutador del lado del cliente la resuelva.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
