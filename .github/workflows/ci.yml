name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run typecheck
      - run: npm run build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run build

  migraciones:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: barmultisede
          POSTGRES_PASSWORD: barmultisede
          POSTGRES_DB: barmultisede
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U barmultisede -d barmultisede"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar migraciones en orden
        run: |
          for f in database/migrations/*.sql; do
            echo "Aplicando $f"
            PGPASSWORD=barmultisede psql -h localhost -U barmultisede -d barmultisede -f "$f"
          done
